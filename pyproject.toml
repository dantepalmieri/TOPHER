[project]
name = "topher"
version = "0.8.2"
description = "TOPHER - a personal multi-agent assistant with a live conversation dashboard"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# without this, plain `pytest` (not `python -m pytest`) never adds the project
# root to sys.path on its own - there's no installed package, no conftest.py,
# and tests/ has no __init__.py for pytest's own rootdir-insertion to reach the
# repo root instead. found via a real ci failure (ModuleNotFoundError:
# second_brain) that `python -m pytest` locally never reproduced, since -m
# itself adds cwd to sys.path and silently masked this
pythonpath = ["."]

[tool.ruff]
line-length = 125
exclude = ["packaging/launcher/_build_venv", "packaging/payload"]

[tool.ruff.lint]
# scoped deliberately to pyflakes (real bugs: unused imports, undefined names)
# and pycodestyle errors - ruff's stricter opinionated rule sets (import
# sorting, blind-except, flake8-datetimez, etc.) would flag a lot of this
# project's already-deliberate design choices (e.g. best-effort try/except
# swallowing, documented in the modules that use it) as if they were bugs
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# deliberately inserts onto sys.path before importing second_brain, so the
# package resolves correctly regardless of the caller's own cwd - the same
# reasoning is documented in the file's own header comment
"packaging/launcher/tray_app.py" = ["E402"]
